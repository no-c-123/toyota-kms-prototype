            <script>function neighbourhoodHighlight(params) {
  // console.log("in nieghbourhoodhighlight");
  allNodes = nodes.get({ returnType: "Object" });
  // originalNodes = JSON.parse(JSON.stringify(allNodes));
  // if something is selected:
  if (params.nodes.length > 0) {
    highlightActive = true;
    var i, j;
    var selectedNode = params.nodes[0];
    var degrees = 2;

    // mark all nodes as hard to read.
    for (let nodeId in allNodes) {
      // nodeColors[nodeId] = allNodes[nodeId].color;
      allNodes[nodeId].color = "rgba(200,200,200,0.5)";
      if (allNodes[nodeId].hiddenLabel === undefined) {
        allNodes[nodeId].hiddenLabel = allNodes[nodeId].label;
        allNodes[nodeId].label = undefined;
      }
    }
    var connectedNodes = network.getConnectedNodes(selectedNode);
    var allConnectedNodes = [];

    // get the second degree nodes
    for (i = 1; i < degrees; i++) {
      for (j = 0; j < connectedNodes.length; j++) {
        allConnectedNodes = allConnectedNodes.concat(
          network.getConnectedNodes(connectedNodes[j])
        );
      }
    }

    // all second degree nodes get a different color and their label back
    for (i = 0; i < allConnectedNodes.length; i++) {
      // allNodes[allConnectedNodes[i]].color = "pink";
      allNodes[allConnectedNodes[i]].color = "rgba(150,150,150,0.75)";
      if (allNodes[allConnectedNodes[i]].hiddenLabel !== undefined) {
        allNodes[allConnectedNodes[i]].label =
          allNodes[allConnectedNodes[i]].hiddenLabel;
        allNodes[allConnectedNodes[i]].hiddenLabel = undefined;
      }
    }

    // all first degree nodes get their own color and their label back
    for (i = 0; i < connectedNodes.length; i++) {
      // allNodes[connectedNodes[i]].color = undefined;
      allNodes[connectedNodes[i]].color = nodeColors[connectedNodes[i]];
      if (allNodes[connectedNodes[i]].hiddenLabel !== undefined) {
        allNodes[connectedNodes[i]].label =
          allNodes[connectedNodes[i]].hiddenLabel;
        allNodes[connectedNodes[i]].hiddenLabel = undefined;
      }
    }

    // the main node gets its own color and its label back.
    // allNodes[selectedNode].color = undefined;
    allNodes[selectedNode].color = nodeColors[selectedNode];
    if (allNodes[selectedNode].hiddenLabel !== undefined) {
      allNodes[selectedNode].label = allNodes[selectedNode].hiddenLabel;
      allNodes[selectedNode].hiddenLabel = undefined;
    }
  } else if (highlightActive === true) {
    // console.log("highlightActive was true");
    // reset all nodes
    for (let nodeId in allNodes) {
      // allNodes[nodeId].color = "purple";
      allNodes[nodeId].color = nodeColors[nodeId];
      // delete allNodes[nodeId].color;
      if (allNodes[nodeId].hiddenLabel !== undefined) {
        allNodes[nodeId].label = allNodes[nodeId].hiddenLabel;
        allNodes[nodeId].hiddenLabel = undefined;
      }
    }
    highlightActive = false;
  }

  // transform the object into an array
  var updateArray = [];
  if (params.nodes.length > 0) {
    for (let nodeId in allNodes) {
      if (allNodes.hasOwnProperty(nodeId)) {
        // console.log(allNodes[nodeId]);
        updateArray.push(allNodes[nodeId]);
      }
    }
    nodes.update(updateArray);
  } else {
    // console.log("Nothing was selected");
    for (let nodeId in allNodes) {
      if (allNodes.hasOwnProperty(nodeId)) {
        // console.log(allNodes[nodeId]);
        // allNodes[nodeId].color = {};
        updateArray.push(allNodes[nodeId]);
      }
    }
    nodes.update(updateArray);
  }
}

function filterHighlight(params) {
  allNodes = nodes.get({ returnType: "Object" });
  // if something is selected:
  if (params.nodes.length > 0) {
    filterActive = true;
    let selectedNodes = params.nodes;

    // hiding all nodes and saving the label
    for (let nodeId in allNodes) {
      allNodes[nodeId].hidden = true;
      if (allNodes[nodeId].savedLabel === undefined) {
        allNodes[nodeId].savedLabel = allNodes[nodeId].label;
        allNodes[nodeId].label = undefined;
      }
    }

    for (let i=0; i < selectedNodes.length; i++) {
      allNodes[selectedNodes[i]].hidden = false;
      if (allNodes[selectedNodes[i]].savedLabel !== undefined) {
        allNodes[selectedNodes[i]].label = allNodes[selectedNodes[i]].savedLabel;
        allNodes[selectedNodes[i]].savedLabel = undefined;
      }
    }

  } else if (filterActive === true) {
    // reset all nodes
    for (let nodeId in allNodes) {
      allNodes[nodeId].hidden = false;
      if (allNodes[nodeId].savedLabel !== undefined) {
        allNodes[nodeId].label = allNodes[nodeId].savedLabel;
        allNodes[nodeId].savedLabel = undefined;
      }
    }
    filterActive = false;
  }

  // transform the object into an array
  var updateArray = [];
  if (params.nodes.length > 0) {
    for (let nodeId in allNodes) {
      if (allNodes.hasOwnProperty(nodeId)) {
        updateArray.push(allNodes[nodeId]);
      }
    }
    nodes.update(updateArray);
  } else {
    for (let nodeId in allNodes) {
      if (allNodes.hasOwnProperty(nodeId)) {
        updateArray.push(allNodes[nodeId]);
      }
    }
    nodes.update(updateArray);
  }
}

function selectNode(nodes) {
  network.selectNodes(nodes);
  neighbourhoodHighlight({ nodes: nodes });
  return nodes;
}

function selectNodes(nodes) {
  network.selectNodes(nodes);
  filterHighlight({nodes: nodes});
  return nodes;
}

function highlightFilter(filter) {
  let selectedNodes = []
  let selectedProp = filter['property']
  if (filter['item'] === 'node') {
    let allNodes = nodes.get({ returnType: "Object" });
    for (let nodeId in allNodes) {
      if (allNodes[nodeId][selectedProp] && filter['value'].includes((allNodes[nodeId][selectedProp]).toString())) {
        selectedNodes.push(nodeId)
      }
    }
  }
  else if (filter['item'] === 'edge'){
    let allEdges = edges.get({returnType: 'object'});
    // check if the selected property exists for selected edge and select the nodes connected to the edge
    for (let edge in allEdges) {
      if (allEdges[edge][selectedProp] && filter['value'].includes((allEdges[edge][selectedProp]).toString())) {
        selectedNodes.push(allEdges[edge]['from'])
        selectedNodes.push(allEdges[edge]['to'])
      }
    }
  }
  selectNodes(selectedNodes)
}</script>

e \u2014 El ritmo de producci\u00f3n que corresponde a la demanda del cliente: el tiempo disponible dividido entre las unidades requeridas."}, {"color": "#9AA0A6", "font": {"color": "#1C1C1C"}, "id": "concept:heijunka", "label": "Heijunka", "shape": "dot", "size": 14, "title": "Heijunka \u2014 Nivelaci\u00f3n de la producci\u00f3n: mezclar modelos y vol\u00famenes de forma pareja durante el turno para evitar picos y mantener un flujo estable."}, {"color": "#9AA0A6", "font": {"color": "#1C1C1C"}, "id": "concept:milk-run", "label": "Milk run", "shape": "dot", "size": 14, "title": "Milk run \u2014 Una ruta fija en la que un cami\u00f3n recoge cantidades peque\u00f1as de varios proveedores en horarios programados."}, {"color": "#9AA0A6", "font": {"color": "#1C1C1C"}, "id": "concept:jis", "label": "Entrega en secuencia", "shape": "dot", "size": 14, "title": "Entrega en secuencia \u2014 Las piezas llegan a la l\u00ednea en el orden exacto de los veh\u00edculos que se est\u00e1n fabricando."}, {"color": "#9AA0A6", "font": {"color": "#1C1C1C"}, "id": "concept:smed", "label": "SMED (cambio r\u00e1pido)", "shape": "dot", "size": 14, "title": "SMED (cambio r\u00e1pido) \u2014 Single-Minute Exchange of Die: t\u00e9cnicas para reducir el tiempo de cambio de modelo y que los lotes peque\u00f1os sean rentables."}, {"color": "#9AA0A6", "font": {"color": "#1C1C1C"}, "id": "concept:standard-work", "label": "Trabajo estandarizado", "shape": "dot", "size": 14, "title": "Trabajo estandarizado \u2014 La mejor forma conocida de hacer un trabajo, documentada con su secuencia, takt time e inventario est\u00e1ndar. Es la base para el kaizen."}, {"color": "#9AA0A6", "font": {"color": "#1C1C1C"}, "id": "concept:5s", "label": "5S", "shape": "dot", "size": 14, "title": "5S \u2014 M\u00e9todo de organizaci\u00f3n del lugar de trabajo: clasificar, ordenar, limpiar, estandarizar y disciplina."}, {"color": "#9AA0A6", "font": {"color": "#1C1C1C"}, "id": "concept:tpm", "label": "TPM (mantenimiento productivo total)", "shape": "dot", "size": 14, "title": "TPM (mantenimiento productivo total) \u2014 Enfoque de mantenimiento en el que los operadores hacen mantenimiento aut\u00f3nomo diario y el mantenimiento planeado evita aver\u00edas."}, {"color": "#9AA0A6", "font": {"color": "#1C1C1C"}, "id": "concept:muda", "label": "Muda (desperdicio)", "shape": "dot", "size": 14, "title": "Muda (desperdicio) \u2014 Cualquier actividad que agrega costo pero no valor, como esperas, exceso de inventario, sobreproducci\u00f3n o movimientos innecesarios."}, {"color": "#9AA0A6", "font": {"color": "#1C1C1C"}, "id": "concept:genba", "label": "Genba (ir a ver)", "shape": "dot", "size": 14, "title": "Genba (ir a ver) \u2014 El lugar real donde ocurre el trabajo. Los l\u00edderes de Toyota van al genba para ver los problemas con sus propios ojos."}, {"color": "#9AA0A6", "font": {"color": "#1C1C1C"}, "id": "concept:root-cause", "label": "An\u00e1lisis de causa ra\u00edz (5 porqu\u00e9s)", "shape": "dot", "size": 14, "title": "An\u00e1lisis de causa ra\u00edz (5 porqu\u00e9s) \u2014 Preguntar por qu\u00e9 varias veces, normalmente cinco, hasta encontrar la causa real de un problema y aplicar una contramedida."}, {"color": "#9AA0A6", "font": {"color": "#1C1C1C"}, "id": "concept:pdca", "label": "PDCA", "shape": "dot", "size": 14, "title": "PDCA \u2014 Planear, Hacer, Verificar, Actuar: el ciclo de mejora para probar cambios y convertirlos en el nuevo est\u00e1ndar."}, {"color": "#9AA0A6", "font": {"color": "#1C1C1C"}, "id": "concept:a3", "label": "Reporte A3", "shape": "dot", "size": 14, "title": "Reporte A3 \u2014 Un reporte de soluci\u00f3n de problemas en una sola hoja tama\u00f1o A3: antecedentes, situaci\u00f3n actual, causa ra\u00edz, contramedidas y seguimiento."}, {"color": "#9AA0A6", "font": {"color": "#1C1C1C"}, "id": "concept:quality-circle", "label": "C\u00edrculo de calidad", "shape": "dot", "size": 14, "title": "C\u00edrculo de calidad \u2014 Un equipo peque\u00f1o de trabajadores que se re\u00fane con regularidad para resolver problemas de calidad de su propia \u00e1rea."}, {"color": "#9AA0A6", "font": {"color": "#1C1C1C"}, "id": "concept:tacit", "label": "Conocimiento t\u00e1cito", "shape": "dot", "size": 14, "title": "Conocimiento t\u00e1cito \u2014 El saber hacer que vive en la experiencia de las personas y es dif\u00edcil de escribir. La gesti\u00f3n del conocimiento busca capturarlo y compartirlo."}, {"color": "#9AA0A6", "font": {"color": "#1C1C1C"}, "id": "concept:job-instruction", "label": "Instrucci\u00f3n de trabajo (JI)", "shape": "dot", "size": 14, "title": "Instrucci\u00f3n de trabajo (JI) \u2014 Una forma estructurada de ense\u00f1ar un trabajo: dividirlo en pasos y puntos clave, demostrarlo, dejar que el aprendiz practique y dar seguimiento."}, {"color": "#9AA0A6", "font": {"color": "#1C1C1C"}, "id": "concept:cross-training", "label": "Capacitaci\u00f3n cruzada", "shape": "dot", "size": 14, "title": "Capacitaci\u00f3n cruzada \u2014 Capacitar a las personas en varios procesos para que el equipo pueda cubrir ausencias y rotar puestos."}, {"color": "#9AA0A6", "font": {"color": "#1C1C1C"}, "id": "concept:loto", "label": "Bloqueo y etiquetado", "shape": "dot", "size": 14, "title": "Bloqueo y etiquetado \u2014 Procedimiento de seguridad que a\u00edsla todas las fuentes de energ\u00eda con candados y etiquetas personales antes del mantenimiento."}, {"color": "#9AA0A6", "font": {"color": "#1C1C1C"}, "id": "concept:ppe", "label": "Equipo de protecci\u00f3n personal", "shape": "dot", "size": 14, "title": "Equipo de protecci\u00f3n personal \u2014 Equipo como lentes de seguridad, guantes, tapones auditivos y zapatos de seguridad que protege a los trabajadores de los peligros."}, {"color": "#9AA0A6", "font": {"color": "#1C1C1C"}, "id": "concept:spc", "label": "Control estad\u00edstico del proceso", "shape": "dot", "size": 14, "title": "Control estad\u00edstico del proceso \u2014 Uso de gr\u00e1ficas de control e \u00edndices de capacidad como el Cpk para mantener un proceso estable y detectar problemas a tiempo."}, {"color": "#9AA0A6", "font": {"color": "#1C1C1C"}, "id": "concept:electrification", "label": "Trenes motrices electrificados", "shape": "dot", "size": 14, "title": "Trenes motrices electrificados \u2014 Tecnolog\u00edas h\u00edbridas, el\u00e9ctricas de bater\u00eda y de celda de combustible de hidr\u00f3geno que Toyota desarrolla para reducir emisiones."}, {"color": "#9AA0A6", "font": {"color": "#1C1C1C"}, "id": "concept:inspection", "label": "Inspecci\u00f3n de calidad", "shape": "dot", "size": 14, "title": "Inspecci\u00f3n de calidad \u2014 Revisar los productos contra el est\u00e1ndar en puntos definidos (recibo, proceso y final) para detener y corregir las piezas no conformes."}, {"color": "#9AA0A6", "font": {"color": "#1C1C1C"}, "id": "concept:customer-voice", "label": "Voz del cliente", "shape": "dot", "size": 14, "title": "Voz del cliente \u2014 Informaci\u00f3n que viene de los clientes, como reclamos de garant\u00eda, quejas y llamados a revisi\u00f3n, que se usa para encontrar y corregir problemas."}, {"color": "#9AA0A6", "font": {"color": "#1C1C1C"}, "id": "concept:risk-assessment", "label": "Evaluaci\u00f3n de riesgos", "shape": "dot", "size": 14, "title": "Evaluaci\u00f3n de riesgos \u2014 Identificar peligros, estimar qu\u00e9 tan probable y grave podr\u00eda ser una lesi\u00f3n y poner controles antes de que alguien se lastime."}, {"color": "#9AA0A6", "font": {"color": "#1C1C1C"}, "id": "concept:emergency", "label": "Preparaci\u00f3n ante emergencias", "shape": "dot", "size": 14, "title": "Preparaci\u00f3n ante emergencias \u2014 Planes, simulacros y recursos para responder a incendios, derrames, sismos o rescates."}, {"color": "#9AA0A6", "font": {"color": "#1C1C1C"}, "id": "concept:machine-guarding", "label": "Protecci\u00f3n de m\u00e1quinas", "shape": "dot", "size": 14, "title": "Protecci\u00f3n de m\u00e1quinas \u2014 Barreras f\u00edsicas y electr\u00f3nicas (cercas, cortinas de luz, interruptores, paros de emergencia) que mantienen a las personas lejos de la maquinaria en movimiento."}, {"color": "#9AA0A6", "font": {"color": "#1C1C1C"}, "id": "concept:validation", "label": "Pruebas y validaci\u00f3n de prototipos", "shape": "dot", "size": 14, "title": "Pruebas y validaci\u00f3n de prototipos \u2014 Probar los dise\u00f1os en prototipos, bancos de prueba, simulaciones y pistas antes de que lleguen a producci\u00f3n."}, {"color": "#9AA0A6", "font": {"color": "#1C1C1C"}, "id": "concept:vehicle-safety", "label": "Seguridad del veh\u00edculo", "shape": "dot", "size": 14, "title": "Seguridad del veh\u00edculo \u2014 Sistemas de frenado, estructura contra choques y asistencia al conductor que protegen a las personas dentro y alrededor del veh\u00edculo."}, {"color": "#9AA0A6", "font": {"color": "#1C1C1C"}, "id": "concept:supplier-management", "label": "Gesti\u00f3n de proveedores", "shape": "dot", "size": 14, "title": "Gesti\u00f3n de proveedores \u2014 Seleccionar, evaluar y desarrollar proveedores en calidad, costo, entrega y capacidad."}, {"color": "#9AA0A6", "font": {"color": "#1C1C1C"}, "id": "concept:inventory", "label": "Control de inventario", "shape": "dot", "size": 14, "title": "Control de inventario \u2014 Mantener la cantidad correcta de material en el lugar correcto y asegurar que el sistema coincide con lo que hay f\u00edsicamente."}, {"color": "#9AA0A6", "font": {"color": "#1C1C1C"}, "id": "concept:transport", "label": "Transporte y aduanas", "shape": "dot", "size": 14, "title": "Transporte y aduanas \u2014 Mover las piezas de los proveedores a la planta: camiones, rutas, costo de flete y tr\u00e1mites de importaci\u00f3n."}, {"color": "#9AA0A6", "font": {"color": "#1C1C1C"}, "id": "concept:people-development", "label": "Desarrollo de personas", "shape": "dot", "size": 14, "title": "Desarrollo de personas \u2014 Evaluar, guiar, reconocer y hacer crecer a los empleados con retroalimentaci\u00f3n, mentor\u00eda y planes de carrera."}, {"color": "#9AA0A6", "font": {"color": "#1C1C1C"}, "id": "concept:software", "label": "Software del veh\u00edculo", "shape": "dot", "size": 14, "title": "Software del veh\u00edculo \u2014 Software que corre en el veh\u00edculo, desde el infoentretenimiento hasta la asistencia al conductor, incluyendo actualizaciones por aire y ciberseguridad."}, {"color": "#9AA0A6", "font": {"color": "#1C1C1C"}, "id": "concept:materials", "label": "Materiales y corrosi\u00f3n", "shape": "dot", "size": 14, "title": "Materiales y corrosi\u00f3n \u2014 Elegir acero, aluminio, compuestos y recubrimientos por resistencia, peso, costo y protecci\u00f3n contra el \u00f3xido."}, {"color": "#9AA0A6", "font": {"color": "#1C1C1C"}, "id": "concept:nvh", "label": "Ruido, vibraci\u00f3n y aspereza", "shape": "dot", "size": 14, "title": "Ruido, vibraci\u00f3n y aspereza \u2014 Trabajo de ingenier\u00eda para reducir el ruido y la vibraci\u00f3n no deseados que los clientes escuchan o sienten en el veh\u00edculo."}, {"color": "#7FB77E", "font": {"color": "#1C1C1C"}, "id": "type:Standardized work", "label": "Trabajo estandarizado", "shape": "dot", "size": 12, "title": "Trabajo estandarizado"}, {"color": "#7FB77E", "font": {"color": "#1C1C1C"}, "id": "type:Procedure", "label": "Procedimiento", "shape": "dot", "size": 12, "title": "Procedimiento"}, {"color": "#7FB77E", "font": {"color": "#1C1C1C"}, "id": "type:Report", "label": "Reporte", "shape": "dot", "size": 12, "title": "Reporte"}, {"color": "#7FB77E", "font": {"color": "#1C1C1C"}, "id": "type:Plan", "label": "Plan", "shape": "dot", "size": 12, "title": "Plan"}, {"color": "#7FB77E", "font": {"color": "#1C1C1C"}, "id": "type:Policy", "label": "Pol\u00edtica", "shape": "dot", "size": 12, "title": "Pol\u00edtica"}, {"color": "#7FB77E", "font": {"color": "#1C1C1C"}, "id": "type:Training", "label": "Capacitaci\u00f3n", "shape": "dot", "size": 12, "title": "Capacitaci\u00f3n"}, {"color": "#7FB77E", "font": {"color": "#1C1C1C"}, "id":
